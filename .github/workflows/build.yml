# GitHub Actions：用打包镜像构建鸿蒙 HAP 与 ArkUI-X 的 Android APK
#
# 镜像 xuxiaoweicomcn/hmos-command-arkui-x-android:26.0.0.851-26.0.0.28-36-36.0.0
# 里是 DevEco command line tools 26.0.0.851 + ArkUI-X 26.0.0.28 + Android SDK 36 / build-tools 36.0.0，
# 工具链全在镜像里（node / npm / hvigorw / ohpm / java / Android SDK），runner 上不需要装任何东西。
#
name: build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LANG: C.UTF-8
  # 产品名：优先取仓库 / 组织变量 vars.PRODUCT，没有设置时回落到 build-profile.json5 里的 default
  PRODUCT: ${{ vars.PRODUCT || 'default' }}
  # Gradle 用户目录放进工作区才能被 actions/cache 缓存（镜像里默认是 ~/.gradle，在挂载卷之外）
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle

jobs:
  build:
    name: HAP + APK
    runs-on: ubuntu-latest
    # 首次要整份拉 3.2 GB 的镜像，之后每次 sdk / gradle 依赖下载也要几分钟
    timeout-minutes: 90
    container:
      image: xuxiaoweicomcn/hmos-command-arkui-x-android:26.0.0.851-26.0.0.28-36-36.0.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 少哪个工具一眼能看出来（镜像本身不带这些检查）
      - name: 环境自检
        run: |
          node -v
          npm -v
          hvigorw -v
          ohpm -v
          java -version

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .gradle
            .arkui-x/android/.gradle
            .arkui-x/android/app/libs
          key: ${{ runner.os }}-build-${{ hashFiles('hvigor/hvigor-config.json5', 'oh-package-lock.json5', '.arkui-x/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-build-

      # oh_modules 没入库（.gitignore 忽略），干净检出必须先装依赖，否则 ArkTS 编译报 Cannot find module
      - name: 安装 ohpm 依赖
        run: ohpm install --all

      # 用 publish-apk 把 secrets 还原成 build-profile.json5 认得的签名材料，镜像里没有这个 CLI
      - name: 安装 publish-apk
        run: |
          npm install -g publish-apk
          # 版本写进日志：装的是 npm 上的 latest，出问题时先对照版本再查命令行为差异
          publish-apk --version

      # 调试：打印改动前的 build-profile.json5，与下面"生成后"那份对比，确认 material 是被替换而不是新建。
      # 口令已是密文，但整份配置会进日志，排查完记得删掉这两步
      - name: 查看签名配置（生成前）
        run: cat build-profile.json5

      # 动态生成配置：BASE64 材料先落到 material/ 并校验证书 / Profile / p12 与口令，
      # 全部通过才改写 build-profile.json5 的 material，写前备份到 .signing/backup/，
      # 口令只进 material 的密文，不会出现在日志里
      - name: 生成签名配置
        env:
          HARMONY_STORE_FILE_BASE64: ${{ secrets.HARMONY_STORE_FILE_BASE64 }}
          HARMONY_PROFILE_BASE64: ${{ secrets.HARMONY_PROFILE_BASE64 }}
          HARMONY_CERTPATH_BASE64: ${{ secrets.HARMONY_CERTPATH_BASE64 }}
          HARMONY_STORE_PASSWORD: ${{ secrets.HARMONY_STORE_PASSWORD }}
          HARMONY_KEY_PASSWORD: ${{ secrets.HARMONY_KEY_PASSWORD }}
          HARMONY_KEY_ALIAS: ${{ secrets.HARMONY_KEY_ALIAS }}
          # 与构建用同一个产品：按 products[].name 找到它挂的 signingConfig，PRODUCT 变了签名配置也跟着变
          HARMONY_PRODUCT: ${{ env.PRODUCT }}
          # 签名算法，沿用仓库当前签名配置的 SHA256withECDSA
          HARMONY_SIGN_ALG: ${{ secrets.HARMONY_SIGN_ALG }}
        run: publish-apk huawei signing-material-env

      # 调试：打印改动后的 build-profile.json5，确认 material 的 storeFile / certpath / profile /
      # keyAlias / signAlg 与口令密文都已替换，且没把别的字段改坏
      - name: 查看签名配置（生成后）
        run: cat build-profile.json5

      # 入口任务不传 buildMode 时 hvigor 按 debug 走，发版要的是 release 字节码，所以显式给
      - name: 构建 HAP
        run: hvigorw assembleHap --no-daemon -p product="$PRODUCT" -p buildMode=release

      # 打印包名 / 版本 / API 与签名证书，确认打出来的是 release 且签名用的是刚写回的那套材料
      - name: 查看 HAP 信息
        run: publish-apk hap --file entry/build/default/outputs/*/*.hap

      # 各产物分开上传，下载时不用从同一个压缩包里挑；if-no-files-found: error 让产物缺失直接失败
      - name: 上传 HAP 产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hap-${{ github.sha }}
          path: |
            entry/build/default/outputs/default/*.hap
          if-no-files-found: error
          retention-days: 7

      # 安卓发布签名：用 secrets 还原 keystore 并生成 Gradle 读取的 keystore.properties（都不入库）。
      # 步骤在 .arkui-x/android 下执行：keystore 的落盘路径与配置里 storeFile 的取值同一基准，
      # 都由 app/build.gradle 的 rootProject.file(...) 解析。
      # 注意：keystore-config 从 publish-apk 0.0.1-alpha.20 起提供，安装步骤要装到该版本以上
      - name: 生成安卓签名配置
        working-directory: .arkui-x/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # 先按 BASE64 解码出 keystore（0600），再写 keystore.properties（0600）；
          # 口令 / 别名由后面 Gradle 的 validateSigningRelease 校验
          publish-apk keystore-config --store-file publish_apk_demo.keystore --out keystore.properties

      # ArkUI-X 跨平台打包 Android：-p platforms=android 只打安卓（ios 那套要 Xcode，runner 上没有）；
      # 安卓侧签名走 Gradle，读取上一步生成的 keystore.properties。
      # 同一次 assembleApp 里还会跑 SignApp 产出鸿蒙整包（.app），两个产物都在这步之后
      - name: 构建 Android APK
        run: hvigorw assembleApp --no-daemon -p platforms=android -p product="$PRODUCT" -p buildMode=release

      # 同上，看 Android 侧 APK 的包名 / SDK / ABI 与签名证书（应为 keystore.properties 里的发布证书）
      - name: 查看 APK 信息
        run: publish-apk apk --file .arkui-x/android/app/build/outputs/apk/*/*.apk

      # 鸿蒙整包（.app）：AppGallery 上架 / 提交审核用，落在工程根的 build/outputs/<产物名>/ 下
      - name: 查看 APP 信息
        run: publish-apk app --file build/outputs/*/*.app

      - name: 上传 APK 产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-${{ github.sha }}
          path: |
            .arkui-x/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: 上传 APP 产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ github.sha }}
          path: |
            build/outputs/*/*.app
          if-no-files-found: error
          retention-days: 7
